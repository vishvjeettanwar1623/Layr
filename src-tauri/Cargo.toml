[package]
name = "layr"
version = "0.1.0"
description = "Workspace launcher for Windows 11"
authors = ["Layr"]
edition = "2021"

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "fast-rng"] }
log = "0.4"
env_logger = "0.11"
thiserror = "2"
dirs = "5"
fastrand = "2"
winreg = "0.56"
tauri-plugin-notification = "2"

[dev-dependencies]
tempfile = "3"

[dependencies.windows]
version = "0.61"
features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_UI_HiDpi",
    "Win32_System_ProcessStatus",
    "Win32_Security",
]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

